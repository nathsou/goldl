name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Test
        run: cargo test --release --workspace
      - name: Build WebAssembly
        run: cargo build --release -p goldl-wasm --target wasm32-unknown-unknown
      - name: Example test benches
        run: for f in examples/*.goldl; do ./target/release/goldl test "$f" || exit 1; done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build playground
        working-directory: web
        run: npm ci && npm run wasm && npm run check && npm run build
