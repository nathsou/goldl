[workspace]
resolver = "2"
members = ["crates/goldl-life", "crates/goldl", "crates/goldl-cli", "crates/goldl-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
